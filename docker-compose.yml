services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./data:/data:ro
      - "./Anuário_2025:/sources/anuario:ro"
      - "./Relatorio_Resultado_Totalizacao_2024_PA:/sources/pdfs:ro"
      - ./mapas:/sources/mapas:ro
      - ./mppa:/sources/mppa:ro
      - ./pcpa:/sources/pcpa:ro
      - mapas_publicos:/output/mapas
    restart: "no"

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${APP_PORT}:80"
    volumes:
      - mapas_publicos:/var/www/html/public/assets/mapas:ro
    restart: unless-stopped

volumes:
  pgdata:
  mapas_publicos:
